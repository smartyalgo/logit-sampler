# Copy to the repo root. Set site_name, site_description, repo_url, and nav.
site_name: CHANGE-ME
site_description: CHANGE-ME one sentence.
repo_url: https://github.com/OWNER/REPO
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

# Left panel. A page that is not listed here is unreachable.
nav:
  - Overview: index.md
  - Getting started:
      - Install: getting-started/install.md
  - Architecture: architecture.md
  - Development: development.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Broken cross-page links and anchors fail `mkdocs build --strict`.
validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
