name: Tests

# GitHub only runs workflows from the repo-root .github/workflows, so every
# component's lint and tests live here.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  stateful-sampler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stateful_sampler
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --verbose

  inference-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference_engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Tests need numpy + the FastAPI stack, but NOT llama-cpp-python: the model
      # wrapper is type-only at import time, so the protocol/client/engine/server
      # tests run in an ephemeral env (--no-project) without building the native
      # wheel. LlamaModel is covered by the manual e2e run.
      - name: Ruff format check
        run: uv run --no-project --with ruff==0.15.14 ruff format --check .

      - name: Ruff lint
        run: uv run --no-project --with ruff==0.15.14 ruff check .

      - name: Pytest with coverage
        run: >-
          uv run --no-project
          --with pytest --with pytest-cov --with numpy --with fastapi --with sse-starlette --with httpx
          pytest -v --cov=tcpip_gen --cov-report=term-missing

  prompt-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompt_eval
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff format check
        run: uv run --no-project --with ruff==0.15.14 ruff format --check .

      - name: Pytest with coverage
        run: uv run --locked --with pytest-cov pytest -v --cov=. --cov-report=term-missing
