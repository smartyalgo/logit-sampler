name: Docs

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # --strict turns broken cross-page links and anchors into a failed build.
      - name: Build docs
        run: uv run --locked mkdocs build --strict
