[project]
name = "stateful-sampler-inference"
version = "0.1.0"
description = "Python recreation of inf.zig's tcpip_gen: llama.cpp inference with remote logit sampling over TCP."
readme = "README.md"
requires-python = ">=3.11.12"
dependencies = [
    "fastapi>=0.136.3",
    "llama-cpp-python>=0.3.23",
    "numpy>=2.4.6",
    "sse-starlette>=3.4.4",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
